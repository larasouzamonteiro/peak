<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a2a2c"/><stop offset=".55" stop-color="#a0634a"/><stop offset="1" stop-color="#e8b68a"/></linearGradient>
    <linearGradient id="m1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a5a48"/><stop offset="1" stop-color="#5a3a32"/></linearGradient>
    <linearGradient id="m2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5e3d34"/><stop offset="1" stop-color="#3a2622"/></linearGradient>
    <linearGradient id="rocha" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a302a"/><stop offset="1" stop-color="#20140f"/></linearGradient>
    <radialGradient id="brilho" cx=".5" cy=".62" r=".45"><stop offset="0" stop-color="#ffd9a0" stop-opacity=".95"/><stop offset=".35" stop-color="#e9884e" stop-opacity=".55"/><stop offset="1" stop-color="#1a0e0b" stop-opacity="0"/></radialGradient>
    <radialGradient id="cristal" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffe4f0"/><stop offset=".5" stop-color="#e889b0" stop-opacity=".8"/><stop offset="1" stop-color="#e889b0" stop-opacity="0"/></radialGradient>
    <filter id="nevoa"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="suave"><feGaussianBlur stdDeviation="3"/></filter>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mapa | Peak</title>
  <!-- o iconezinho da aba do navegador (a florzinha) -->
  <link rel="icon" type="image/png" href="../img/favicon.png">

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">

  <!-- esta página tem um CSS só dela (não usa o style.css): o mapa ocupa a tela toda -->
  <link rel="stylesheet" href="../css/mapa.css">
</head>

<body>

  <!-- ===== O MAPA (ocupa a tela inteira) ===== -->
  <main class="mapa">
    <img class="mapa-imagem" id="mapaImagem" src="" alt="Mapa">
  </main>

  <!-- ===== EM CIMA: voltar, nome da campanha e tela cheia ===== -->
  <div class="mapa-topo">
    <!-- voltar para a campanha (o js/mapa.js coloca o id) -->
    <a class="cartao botao-voltar" id="linkVoltar" href="campanhas.html" title="Voltar">‹</a>
    <b class="cartao nome-campanha" id="nomeCampanha">Mapa</b>
    <button type="button" class="cartao botao-cheia" onclick="telaCheia()" title="Tela cheia">⛶</button>
  </div>

  <!-- ===== EMBAIXO, À ESQUERDA: escolher o mapa ===== -->
  <div class="cartao caixa">
    <div class="mapas-linha">
      <!-- os 3 mapas prontos (função desenharMapas) -->
      <div class="mapas" id="listaMapas"></div>

      <!-- o mapa do computador da pessoa (usarImagemEnviada).
           O <label> é o botão "+"; o <input type="file"> fica escondido. -->
      <label class="enviar-mini" for="mapaArquivo" title="Enviar o meu mapa">+</label>
      <input class="oculto" type="file" id="mapaArquivo" accept="image/*" onchange="usarImagemEnviada()">
    </div>
  </div>

  <!-- ===== EMBAIXO, À DIREITA: a música ===== -->
  <div class="cartao caixa caixa-musica">
    <div class="musica-agora">
      <button type="button" class="botao-play" id="botaoPlay" onclick="tocarOuPausar()" title="Tocar / pausar">▶</button>
      <b id="nomeMusica">Escolha uma música</b>
    </div>

    <!-- as 5 músicas do site e a enviada (função desenharMusicas) + o "+" para enviar uma música
         do computador (toca na hora e NÃO fica salva) -->
    <div class="mapas-linha">
      <div class="musicas" id="listaMusicas"></div>
      <label class="enviar-mini" for="musicaArquivo" title="Enviar música">+</label>
      <input class="oculto" type="file" id="musicaArquivo" accept="audio/*" onchange="usarMusicaEnviada()">
    </div>
  </div>

  <!-- script.js primeiro (buscar, lerImagem, avisar...), depois o desta página -->
  <script src="../js/script.js"></script>
  <script src="../js/visual.js"></script>     <!-- só a aparência (modo escuro, abertura, Natal) -->
  <script src="../js/mapa.js"></script>
</body>
</html>

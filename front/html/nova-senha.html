<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trocar senha | Peak</title>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap">

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/entrada.css">
</head>
<body class="entrada">

  <!-- VISUAL: o mesmo fundo e o mesmo "peak." do login -->
    <div class="entrada-fundo"><video autoplay muted loop playsinline poster="../img/index/videos/leona.jpg"><source src="../img/index/videos/LeonaHD.mp4" type="video/webm"><source src="../img/index/videos/LeonaHD.mp4" type="video/mp4"></video></div>
 
  <a class="entrada-marca" href="index.html"><img src="../img/logo.png" alt=""> PEAK</a>
  <div class="entrada-frase frase-login">
    <h2>peak<span>.</span></h2>
    <p>Esqueceu a senha? Acontece com todo aventureiro.</p>
  </div>

  <!-- ESQUECI MINHA SENHA: são 2 passos na mesma página.
         1. a pessoa digita o e-mail e o servidor manda um código (função pedirCodigoSenha do js/nova-senha.js)
         2. ela digita o código e a senha nova (função trocarSenha)
       O passo 2 começa escondido (classe "oculto") e aparece quando o código é enviado.
       O Enter nos campos faz o mesmo que o botão do passo (apertouEnter, no js/script.js). -->
  <div class="entrada-caixa">

    <!-- ===== PASSO 1: PEDIR O CÓDIGO ===== -->
    <div class="entrada-form" id="passoPedir">
      <h1>Esqueci minha senha</h1>
      <p class="entrada-sub">Digite o e-mail da sua conta. Vamos mandar um código de 6 números (por e-mail ou SMS) para você criar uma senha nova.</p>

      <div class="campo">
        <label class="rotulo" for="emailSenha">E-mail</label>
        <input class="input" type="email" id="emailSenha" onkeydown="apertouEnter(event, pedirCodigoSenha)" autocomplete="email">
      </div>

      <!-- por onde o código vai chegar (função escolherVia do js/nova-senha.js).
           SMS só funciona se a pessoa colocou o celular no cadastro; se não, vai por e-mail. -->
      <p class="rotulo">Receber o código por</p>
      <div class="entrada-abas">
        <button type="button" class="ativo" id="viaEmail" onclick="escolherVia('email')">E-mail</button>
        <button type="button" id="viaSms" onclick="escolherVia('sms')">SMS</button>
      </div>

      <p class="alerta" id="alertPedir"></p>

      <button type="button" class="botao botao-principal botao-largo" onclick="pedirCodigoSenha()">Enviar código</button>

      <p class="entrada-rodape"><a href="login.html">Voltar ao login</a></p>
    </div>

    <!-- ===== PASSO 2: CÓDIGO + SENHA NOVA ===== -->
    <div class="entrada-form oculto" id="passoTrocar">
      <h1>Criar senha nova</h1>
      <!-- o texto daqui é escrito pela função pedirCodigoSenha (muda se escolheu e-mail ou SMS) -->
      <p class="entrada-sub" id="ondeChegou"></p>

      <div class="campo">
        <label class="rotulo" for="codigoSenha">Código</label>
        <input class="input" type="text" id="codigoSenha" onkeydown="apertouEnter(event, trocarSenha)" maxlength="6" placeholder="000000">
      </div>

      <div class="linha-campos">
        <div class="campo">
          <label class="rotulo" for="senhaNova">Senha nova</label>
          <input class="input" type="password" id="senhaNova" onkeydown="apertouEnter(event, trocarSenha)" autocomplete="new-password">
        </div>
        <div class="campo">
          <label class="rotulo" for="senhaNova2">Confirmar senha</label>
          <input class="input" type="password" id="senhaNova2" onkeydown="apertouEnter(event, trocarSenha)" autocomplete="new-password">
        </div>
      </div>

      <p class="alerta" id="alertTrocar"></p>

      <button type="button" class="botao botao-principal botao-largo" onclick="trocarSenha()">Salvar senha nova</button>

      <p class="entrada-sub espaco-topo-pequeno">Não chegou? <button type="button" class="link-trocar" onclick="pedirCodigoSenha()">Enviar outro código</button></p>
      <p class="entrada-rodape"><a href="login.html">Voltar ao login</a></p>
    </div>

  </div>
  <script src="../js/script.js"></script>
  <script src="../js/nova-senha.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trocar senha | Peak</title>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap">

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/entrada.css">
</head>
<body class="entrada">

  <!-- VISUAL: o mesmo fundo e o mesmo "peak." do login -->
  <div class="entrada-fundo"></div>
  <a class="entrada-marca" href="index.html"><img src="../img/logo.png" alt=""> PEAK</a>
  <div class="entrada-frase frase-login">
    <h2>peak<span>.</span></h2>
    <p>Esqueceu a senha? Acontece com todo aventureiro.</p>
  </div>

  <!-- ESQUECI MINHA SENHA: são 2 passos na mesma página.
         1. a pessoa digita o e-mail e o servidor manda um código (função pedirCodigoSenha do js/login.js)
         2. ela digita o código e a senha nova (função trocarSenha)
       O passo 2 começa escondido (classe "oculto") e aparece quando o código é enviado. -->
  <div class="entrada-caixa">

    <!-- ===== PASSO 1: PEDIR O CÓDIGO ===== -->
    <div class="entrada-form" id="passoPedir">
      <h1>Esqueci minha senha</h1>
      <p class="entrada-sub">Digite o e-mail da sua conta. Vamos mandar um código de 6 números para você criar uma senha nova.</p>

      <div class="campo">
        <label class="rotulo" for="emailSenha">E-mail</label>
        <input class="input" type="email" id="emailSenha" autocomplete="email">
      </div>

      <p class="alerta" id="alertPedir"></p>

      <button type="button" class="botao botao-principal botao-largo" onclick="pedirCodigoSenha()">Enviar código</button>

      <p class="entrada-rodape"><a href="login.html">Voltar ao login</a></p>
    </div>

    <!-- ===== PASSO 2: CÓDIGO + SENHA NOVA ===== -->
    <div class="entrada-form oculto" id="passoTrocar">
      <h1>Criar senha nova</h1>
      <p class="entrada-sub">Enviamos o código para <b id="emailMostrado"></b>. Ele só vale uma vez.</p>

      <div class="campo">
        <label class="rotulo" for="codigoSenha">Código</label>
        <input class="input" type="text" id="codigoSenha" maxlength="6" placeholder="000000">
      </div>

      <div class="linha-campos">
        <div class="campo">
          <label class="rotulo" for="senhaNova">Senha nova</label>
          <div class="campo-senha">
            <input class="input" type="password" id="senhaNova" autocomplete="new-password">
            <button type="button" class="botao-olho" onclick="verSenha(this)" aria-label="Mostrar senha"><svg class="olho-aberto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="olho-fechado" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-6.5 0-10-7-10-7a18.5 18.5 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c6.5 0 10 7 10 7a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="2" y1="2" x2="22" y2="22"/></svg></button>
          </div>
        </div>
        <div class="campo">
          <label class="rotulo" for="senhaNova2">Confirmar senha</label>
          <div class="campo-senha">
            <input class="input" type="password" id="senhaNova2" autocomplete="new-password">
            <button type="button" class="botao-olho" onclick="verSenha(this)" aria-label="Mostrar senha"><svg class="olho-aberto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="olho-fechado" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-6.5 0-10-7-10-7a18.5 18.5 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c6.5 0 10 7 10 7a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="2" y1="2" x2="22" y2="22"/></svg></button>
          </div>
        </div>
      </div>

      <p class="alerta" id="alertTrocar"></p>

      <button type="button" class="botao botao-principal botao-largo" onclick="trocarSenha()">Salvar senha nova</button>

      <p class="entrada-sub espaco-topo-pequeno">Não chegou? <button type="button" class="link-trocar" onclick="pedirCodigoSenha()">Enviar outro código</button></p>
      <p class="entrada-rodape"><a href="login.html">Voltar ao login</a></p>
    </div>

  </div>

  <script src="../js/script.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirmar e-mail | Peak</title>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap">

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/entrada.css">
</head>
<body class="entrada">

  <!-- VISUAL: o mesmo fundo e o mesmo "peak." do login -->
  <div class="entrada-fundo"><video autoplay muted loop playsinline poster="../img/index/videos/leona.jpg"><source src="../img/index/videos/LeonaHD.mp4" type="video/webm"><source src="../img/index/videos/LeonaHD.mp4" type="video/mp4"></video></div>
  <a class="entrada-marca" href="index.html"><img src="../img/logo.png" alt=""> PEAK</a>
  <div class="entrada-frase frase-login">
    <h2>peak<span>.</span></h2>
    <p>Falta pouco: confirme o seu e-mail para liberar a conta.</p>
  </div>

  <!-- Depois do cadastro a pessoa cai aqui (confirmar.html?email=...) para digitar
       o código de 6 números que chegou no e-mail. -->
  <div class="entrada-caixa">
    <div class="entrada-form">
      <h1>Confirme seu e-mail</h1>
      <p class="entrada-sub">Enviamos um código de 6 números. Digite ele aqui para liberar a sua conta.</p>

      <div class="campo">
        <label class="rotulo" for="email">E-mail</label>
        <!-- o js/login.js já escreve aqui o e-mail que veio no endereço da página -->
        <input class="input" type="email" id="email" onkeydown="apertouEnter(event, confirmar)">
      </div>

      <div class="campo">
        <label class="rotulo" for="codigo">Código</label>
        <input class="input" type="text" id="codigo" onkeydown="apertouEnter(event, confirmar)" maxlength="6" placeholder="000000">
      </div>

      <!-- mensagens do servidor (funções confirmar e reenviar do js/login.js) -->
      <p class="alerta" id="alert"></p>

      <button type="button" class="botao botao-principal botao-largo" onclick="confirmar()">Confirmar</button>

      <p class="entrada-sub espaco-topo-pequeno">Não chegou? <button type="button" class="link-trocar" onclick="reenviar()">Enviar outro código</button></p>
      <p class="entrada-rodape"><a href="login.html">Voltar ao login</a></p>
    </div>
  </div>

  <script src="../js/script.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>

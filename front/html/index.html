  <script>
    // =====================================================
    // MENU DA CAPA (VISUAL)
    // =====================================================

    // um item por linha do menu, na mesma ordem:
    // [título pequeno, texto, número do capítulo, nome do capítulo, página que abre]
    var textos = [
        ['BEM-VINDA À PEAK', 'Uma mesa de RPG no navegador: o mestre cria, o grupo entra e a história começa.', 'CAPÍTULO I', 'O início', 'login.html'],
        ['CAMPANHAS', 'Crie a sua ou use uma oficial. O grupo entra com um código e joga com mapa, música e dados.', 'CAPÍTULO II', 'A mesa', 'login.html'],
        ['COMUNIDADE', 'Encontre jogadores, mestres e artistas que gostam das mesmas coisas que você.', 'CAPÍTULO III', 'O grupo', 'login.html'],
        ['FICHAS', 'Monte seu personagem com raças e classes prontas, retrato e itens. Ou crie a sua própria raça.', 'CAPÍTULO IV', 'Quem você é', 'login.html'],
        ['SOBRE NÓS', 'Quatro alunas do Senac, um projeto, e histórias ligadas aos ODS e a artistas parceiros.', 'CAPÍTULO V', 'A equipe', 'login.html'],
        ['ENTRAR', 'Já tem conta? Volte para a sua mesa. Ainda não tem? Crie em 1 minuto.', 'FIM', 'Entrar', 'login.html']
    ]

    // celular (tela de até 700px) usa as fotos da div .fundos-cel; computador usa a .fundos-pc
    var celular = window.innerWidth <= 700
    var fundos

    if(celular){
        fundos = document.querySelectorAll('.fundos-cel .fundo')
    }else{
        fundos = document.querySelectorAll('.fundos-pc .fundo')
    }

    var itens = document.querySelectorAll('.menu li')
    var pontos = document.querySelectorAll('.pontos i')
    var atual = 0

    // Mostra o item i: acende o item do menu, o fundo e o pontinho (classe "on")
    // e escreve o texto e o capítulo
    function escolher(i){
        atual = i

        for(var k = 0; k < itens.length; k++){
            if(k == i){
                itens[k].classList.add('on')
                fundos[k].classList.add('on')
                pontos[k].classList.add('on')
            }else{
                itens[k].classList.remove('on')
                fundos[k].classList.remove('on')
                pontos[k].classList.remove('on')
            }

            // só vídeo tem play e pause; se o fundo for foto, não faz nada
            if(fundos[k].tagName == 'VIDEO'){
                if(k == i){
                    fundos[k].currentTime = 0
                    fundos[k].play()
                }else{
                    fundos[k].pause()
                }
            }
        }

        document.getElementById('descricao').innerHTML = '<b>' + textos[i][0] + '</b>' + textos[i][1]
        document.getElementById('capNumero').textContent = textos[i][2]
        document.getElementById('capTitulo').textContent = textos[i][3]
    }

    // computador: passar o mouse já troca
    function passar(i){
        if(!celular){
            escolher(i)
        }
    }

    // clique: no computador abre a página na hora.
    // no celular, o 1º toque escolhe e o 2º toque no mesmo item abre.
    function clicar(i){
        if(celular && i != atual){
            escolher(i)
        }else{
            window.location.href = textos[i][4]
        }
    }

    // teclado: setas para cima e para baixo escolhem, Enter abre
    // (só quando a capa está na tela; mais para baixo as setas rolam a página normalmente)
    document.addEventListener('keydown', function(evento){
        if(window.scrollY > window.innerHeight / 2){
            return
        }

        if(evento.key == 'ArrowDown' && atual < itens.length - 1){
            evento.preventDefault()
            escolher(atual + 1)
        }else if(evento.key == 'ArrowUp' && atual > 0){
            evento.preventDefault()
            escolher(atual - 1)
        }else if(evento.key == 'Enter'){
            window.location.href = textos[atual][4]
        }
    })

    escolher(0)
  </script>

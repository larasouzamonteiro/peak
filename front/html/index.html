    <script>
      // =====================================================
      // MENU DA CAPA (VISUAL)
      // =====================================================

      // um item por linha do menu, na mesma ordem:
      // [título pequeno, texto, número do capítulo, nome do capítulo, página que abre]
      var textos = [
          ['BEM-VINDA À PEAK', 'Uma mesa de RPG no navegador: o mestre cria, o grupo entra e a história começa.', 'CAPÍTULO I', 'O início', 'login.html'],
          ['CAMPANHAS', 'Crie a sua ou use uma oficial. O grupo entra com um código e joga com mapa, música e dados.', 'CAPÍTULO II', 'A mesa', 'login.html'],
          ['COMUNIDADE', 'Encontre jogadores, mestres e artistas que gostam das mesmas coisas que você.', 'CAPÍTULO III', 'O grupo', 'login.html'],
          ['FICHAS', 'Monte seu personagem com raças e classes prontas, retrato e itens. Ou crie a sua própria raça.', 'CAPÍTULO IV', 'Quem você é', 'login.html'],
          ['SOBRE NÓS', 'Quatro alunas do Senac, um projeto, e histórias ligadas aos ODS e a artistas parceiros.', 'CAPÍTULO V', 'A equipe', 'login.html'],
          ['ENTRAR', 'Já tem conta? Volte para a sua mesa. Ainda não tem? Crie em 1 minuto.', 'FIM', 'Entrar', 'login.html']
      ]

      // celular (tela de até 700px) usa as fotos da div .fundos-cel; computador usa a .fundos-pc
      var celular = window.innerWidth <= 700
      var fundos

      if(celular){
          fundos = document.querySelectorAll('.fundos-cel .fundo')
      }else{
          fundos = document.querySelectorAll('.fundos-pc .fundo')
      }

      var itens = document.querySelectorAll('.menu li')
      var pontos = document.querySelectorAll('.pontos i')
      var atual = 0

      // VISUAL (celular): o número grande e apagadinho que fica atrás do título
      var romanos = ['I', 'II', 'III', 'IV', 'V', 'VI']

      // Mostra o item i: acende o item do menu, o fundo e o pontinho (classe "on")
      // e escreve o texto e o capítulo
      function escolher(i){
          atual = i

          for(var k = 0; k < itens.length; k++){
              if(k == i){
                  itens[k].classList.add('on')
                  fundos[k].classList.add('on')
                  pontos[k].classList.add('on')
              }else{
                  itens[k].classList.remove('on')
                  fundos[k].classList.remove('on')
                  pontos[k].classList.remove('on')
              }

              // só vídeo tem play e pause; se o fundo for foto, não faz nada
              if(fundos[k].tagName == 'VIDEO'){
                  if(k == i){
                      fundos[k].currentTime = 0
                      // play() devolve uma "promessa"; se a pessoa trocar rápido de item,
                      // o navegador cancela o play e avisa um erro. O catch só ignora esse aviso.
                      var tocando = fundos[k].play()
                      if(tocando){
                          tocando.catch(function(){})
                      }
                  }else{
                      fundos[k].pause()
                  }
              }
          }

          document.getElementById('descricao').innerHTML = '<b>' + textos[i][0] + '</b>' + textos[i][1]
          document.getElementById('capNumero').textContent = textos[i][2]
          document.getElementById('capTitulo').textContent = textos[i][3]
          document.getElementById('celNumero').textContent = romanos[i]
      }

      // computador: passar o mouse já troca
      function passar(i){
          if(!celular){
              escolher(i)
          }
      }

      // clique: no computador abre a página na hora.
      // no celular, o 1º toque escolhe e o 2º toque no mesmo item abre.
      function clicar(i){
          if(celular && i != atual){
              escolher(i)
          }else{
              window.location.href = textos[i][4]
          }
      }

      // teclado: setas para cima e para baixo escolhem, Enter abre
      // (só quando a capa está na tela; mais para baixo as setas rolam a página normalmente)
      document.addEventListener('keydown', function(evento){
          if(window.scrollY > window.innerHeight / 2){
              return
          }

          if(evento.key == 'ArrowDown' && atual < itens.length - 1){
              evento.preventDefault()
              escolher(atual + 1)
          }else if(evento.key == 'ArrowUp' && atual > 0){
              evento.preventDefault()
              escolher(atual - 1)
          }else if(evento.key == 'Enter'){
              window.location.href = textos[atual][4]
          }
      })

      // =====================================================
      // CELULAR: DESLIZAR O DEDO PARA TROCAR DE CAPÍTULO
      // =====================================================
      // touchstart: guarda onde o dedo encostou | touchend: vê para que lado ele andou.
      // Andou mais de 50px para a esquerda -> próximo capítulo; para a direita -> anterior.
      var dedoX = 0

      document.querySelector('.capa').addEventListener('touchstart', function(evento){
          dedoX = evento.touches[0].clientX
      })

      document.querySelector('.capa').addEventListener('touchend', function(evento){
          var andou = evento.changedTouches[0].clientX - dedoX

          if(andou < -50 && atual < itens.length - 1){
              escolher(atual + 1)
          }else if(andou > 50 && atual > 0){
              escolher(atual - 1)
          }
      })

      // tocar numa bolinha também troca de capítulo
      for(var p = 0; p < pontos.length; p++){
          pontos[p].setAttribute('onclick', 'escolher(' + p + ')')
      }

      // botão "ABRIR ›" do celular: abre a página do capítulo que está na tela
      function abrirAtual(){
          window.location.href = textos[atual][4]
      }

      escolher(0)
      
    </script>

<script>
  // ACESSIBILIDADE: o avatar de Libras é pesado. Para não reabrir sozinho (e travar)
  // a cada página nova, apagamos o que o VLibras guardou da página anterior:
  // ele sempre começa fechado, e a pessoa abre quando quiser.
  for(var k = localStorage.length - 1; k >= 0; k--){
      var nomeGuardado = localStorage.key(k)

      if(nomeGuardado && nomeGuardado.toLowerCase().indexOf('vlibras') != -1){
          localStorage.removeItem(nomeGuardado)
      }
  }
</script>
<script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
<script>
  new window.VLibras.Widget('https://vlibras.gov.br/app');
</script>

<script>
  // VISUAL: muda a cor e a posição do botão de Libras.
  // O VLibras desenha o botão dentro de um "shadow root" (uma caixinha fechada)
  // que o CSS do site não alcança. Então, a cada 1/4 de segundo, procuramos essa
  // caixinha; quando ela aparece, colocamos o nosso estilo lá dentro e paramos.
  var tentativasLibras = 0

  var procurarLibras = setInterval(function(){
      tentativasLibras++

      var todos = document.querySelectorAll('*')

      for(var i = 0; i < todos.length; i++){
          var caixa = todos[i].shadowRoot

          if(caixa && caixa.getElementById('vlibras-access')){
              var estilo = document.createElement('style')

                            estilo.textContent =
                  // posição: embaixo à direita, em cima do botão do dado.
                  // cor: o filtro vai na caixinha TODA (botão + fundo), para não sobrar azul nos cantos
                  '#vlibras-access{ top: 10px !important; !important; right: 10px !important; left: auto !important; transform: none !important;' +
                  ' filter: hue-rotate(140deg) saturate(0.85) brightness(0.95); border-radius: 14px; overflow: hidden; background: transparent !important; }' +
                  // o botão de dentro: mesmo arredondado da caixinha
                  '#vlibras-button{ border-radius: 14px; }' +
                  // celular: acima da barra de baixo
                  '@media (max-width: 760px){ #vlibras-access{ bottom: 96px !important; right: 12px !important; } }'
              caixa.appendChild(estilo)
              clearInterval(procurarLibras)
              return
          }
      }

      // se em 10 segundos não achou (internet lenta, VLibras fora do ar), desiste
      if(tentativasLibras > 40){
          clearInterval(procurarLibras)
      }
  }, 250)
</script>

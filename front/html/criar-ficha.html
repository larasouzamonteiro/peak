<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oficina de personagem | Peak</title>
  <!-- o iconezinho da aba do navegador (a florzinha) -->
  <link rel="icon" type="image/png" href="../img/favicon.png">

  <!-- fontes do site (Poppins nos textos, Playfair Display nos títulos da oficina) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700&display=swap">

  <!-- VISUAL: ANTES DE DESENHAR. Este script roda antes da página aparecer:
       - modo escuro: o <html> já ganha a classe "escuro" e a página não pisca branca;
       - abertura: na primeira página da visita (logado), o <html> ganha a classe "abrindo"
         e a página fica escondida até a abertura aparecer (assim o Início não pisca antes).
       (O resto do tema e da abertura está no script.js.) -->
  <script>
    if(localStorage.getItem('tema') == 'escuro'){
      document.documentElement.classList.add('escuro')
    }

    if(localStorage.getItem('token') && !sessionStorage.getItem('abriu')){
      document.documentElement.classList.add('abrindo')
    }
  </script>

  <!-- style.css = o que é igual em todas as páginas | os outros = só desta página -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/oficina.css">
</head>
<body>

  <!-- MENU LATERAL: igual em todas as páginas de dentro. A classe "ativo" marca a página atual. -->
  <aside class="lateral">
    <!-- a conta fica em cima (no lugar da logo). A letra e o nome são preenchidos pelo verificarLogin() do script.js -->
    <a class="lateral-conta" href="perfil.html">
      <div class="avatar" id="menuLetra"></div>
      <span><strong id="menuNome"></strong><small>Ver perfil</small></span>
    </a>

    <nav class="lateral-grupo">
      <a class="lateral-link" href="inicio.html"><img src="../img/icones/inicio.svg" alt=""><span>Início</span></a>
      <a class="lateral-link ativo" href="fichas.html"><img src="../img/icones/fichas.svg" alt=""><span>Fichas</span></a>
      <a class="lateral-link" href="campanhas.html"><img src="../img/icones/campanhas.svg" alt=""><span>Campanhas</span></a>
      <a class="lateral-link" href="monstros.html"><img src="../img/icones/bestiario.svg" alt=""><span>Bestiário</span></a>
       <a class="lateral-link" href="comunidade.html"><img src="../img/icones/comunidade.svg" alt=""><span>Comunidade</span></a>
    
      <a class="lateral-link" href="historia.html"><img src="../img/icones/historia.svg" alt=""><span>História</span></a>
      <!-- só aparece para administradores: quem tira a classe "oculto" é o verificarLogin() do script.js -->
      <a class="lateral-link oculto" id="linkAdmin" href="admin.html"><img src="../img/icones/admin.svg" alt=""><span>Administração</span></a>
      <!-- VISUAL: só aparece no celular, abre o menu inteiro (abrirMais do script.js) -->
      <button type="button" class="lateral-link botao-mais" onclick="abrirMais()"><img src="../img/icones/mais.svg" alt=""><span>Mais</span></button>
    </nav>

    <div class="lateral-rodape">
      <a class="lateral-link" href="perfil.html?aba=configuracoes"><img src="../img/icones/configuracoes.svg" alt=""><span>Configurações</span></a>
      <button type="button" class="lateral-link" onclick="sair()"><img src="../img/icones/sair.svg" alt=""><span>Sair</span></button>
    </div>
  </aside>

  <!-- TOPO: "Boa noite, fulano" (preenchido pelo verificarLogin() do script.js) -->
  <header class="topo">
    <div class="topo-oi"><span id="saudacao">Olá</span>, <b id="nomeLogado"></b></div>
  </header>

  <!-- A classe "oficina" faz esta página usar o visual do css/oficina.css (cards brancos arredondados) -->
  <main class="secao oficina">
    <div class="container">

      <div class="cabecalho-pagina">
        <div>
          <h1 class="titulo">Oficina de personagem</h1>
          <!-- "Etapa 1 de 5": escrito pela função mostrarEtapa() do js/criar-ficha.js -->
          <p class="texto-suave" id="textoEtapa">Etapa 1 de 5</p>
        </div>
      </div>

      <!-- INDICADOR DAS ETAPAS: mostrarEtapa() coloca a classe "ativa" na etapa atual
           e "feita" nas que já passaram.
           Clicar numa etapa que já passou volta para ela (irParaEtapa) -->
      <div class="etapas" id="indicadorEtapas">
        <button type="button" class="etapa-marca ativa" onclick="irParaEtapa(1)">1. Identidade</button>
        <button type="button" class="etapa-marca" onclick="irParaEtapa(2)">2. Raça</button>
        <button type="button" class="etapa-marca" onclick="irParaEtapa(3)">3. Classe</button>
        <button type="button" class="etapa-marca" onclick="irParaEtapa(4)">4. Combate e itens</button>
        <button type="button" class="etapa-marca" onclick="irParaEtapa(5)">5. Atributos e detalhes</button>
      </div>

      <!-- mensagem de erro (etapaValida e salvarFicha escrevem aqui): fica em cima para a pessoa ver na hora -->
      <p class="alerta" id="alert"></p>

      <div class="oficina-grade">
        <div class="formulario">

          <!-- ========== ETAPA 1: Identidade ========== -->
          <div class="card" id="etapa1">
            <h2 class="card-titulo">Identidade</h2>

            <div class="formulario">
              <div class="campo">
                <label class="rotulo" for="nome">Nome do personagem</label>
                <input class="input" type="text" id="nome" maxlength="50" placeholder="Ex.: Amanda" oninput="desenharResumo()">
              </div>

              <div class="campo">
                <span class="rotulo">Retrato</span>
                <!-- Para acrescentar um retrato: coloque a imagem em img/retratos/ e copie uma linha abaixo -->
                  <div class="escolhas-retrato" id="escolhasRetrato">
                  <label class="retrato-opcao"><input type="radio" name="retrato" value="../img/retratos/r01.jpg" checked onchange="escolherRetratoPronto()"><img class="retrato" src="../img/retratos/r01.jpg" alt="">Aprendiz</label>
                  <label class="retrato-opcao"><input type="radio" name="retrato" value="../img/retratos/r02.jpg" onchange="escolherRetratoPronto()"><img class="retrato" src="../img/retratos/r02.jpg" alt="">Cavaleiro</label>
                  <label class="retrato-opcao"><input type="radio" name="retrato" value="../img/retratos/r03.jpg" onchange="escolherRetratoPronto()"><img class="retrato" src="../img/retratos/r03.jpg" alt="">Clériga</label>
                  <label class="retrato-opcao"><input type="radio" name="retrato" value="../img/retratos/r04.jpg" onchange="escolherRetratoPronto()"><img class="retrato" src="../img/retratos/r04.jpg" alt="">Guerreira</label>
                  <label class="retrato-opcao"><input type="radio" name="retrato" value="../img/retratos/r05.jpg" onchange="escolherRetratoPronto()"><img class="retrato" src="../img/retratos/r05.jpg" alt="">Sacerdotisa</label>
                  <label class="retrato-opcao"><input type="radio" name="retrato" value="../img/retratos/r06.jpg" onchange="escolherRetratoPronto()"><img class="retrato" src="../img/retratos/r06.jpg" alt="">Espadachim</label>
                  <label class="retrato-opcao"><input type="radio" name="retrato" value="../img/retratos/r07.jpg" onchange="escolherRetratoPronto()"><img class="retrato" src="../img/retratos/r07.jpg" alt="">Paladino</label>
                  <label class="retrato-opcao"><input type="radio" name="retrato" value="../img/retratos/r08.jpg" onchange="escolherRetratoPronto()"><img class="retrato" src="../img/retratos/r08.jpg" alt="">Maga</label>
                  <label class="retrato-opcao"><input type="radio" name="retrato" value="../img/retratos/r09.jpg" onchange="escolherRetratoPronto()"><img class="retrato" src="../img/retratos/r09.jpg" alt="">Aventureira</label>
                  <label class="retrato-opcao"><input type="radio" name="retrato" value="../img/retratos/r10.jpg" onchange="escolherRetratoPronto()"><img class="retrato" src="../img/retratos/r10.jpg" alt="">Arqueiro</label>
                  <label class="retrato-opcao"><input type="radio" name="retrato" value="../img/retratos/r11.jpg" onchange="escolherRetratoPronto()"><img class="retrato" src="../img/retratos/r11.jpg" alt="">Soldada</label>
                  <label class="retrato-opcao"><input type="radio" name="retrato" value="../img/retratos/r12.jpg" onchange="escolherRetratoPronto()"><img class="retrato" src="../img/retratos/r12.jpg" alt="">Nobre</label>
                  <label class="retrato-opcao"><input type="radio" name="retrato" value="../img/retratos/r13.jpg" onchange="escolherRetratoPronto()"><img class="retrato" src="../img/retratos/r13.jpg" alt="">Aldeã</label>
                  <label class="retrato-opcao"><input type="radio" name="retrato" value="../img/retratos/r14.jpg" onchange="escolherRetratoPronto()"><img class="retrato" src="../img/retratos/r14.jpg" alt="">Cavaleira</label>
                  <label class="retrato-opcao"><input type="radio" name="retrato" value="../img/retratos/r15.jpg" onchange="escolherRetratoPronto()"><img class="retrato" src="../img/retratos/r15.jpg" alt="">Valquíria</label>
                  <label class="retrato-opcao"><input type="radio" name="retrato" value="../img/retratos/r16.jpg" onchange="escolherRetratoPronto()"><img class="retrato" src="../img/retratos/r16.jpg" alt="">Escudeiro</label>
                  <label class="retrato-opcao"><input type="radio" name="retrato" value="../img/retratos/r17.jpg" onchange="escolherRetratoPronto()"><img class="retrato" src="../img/retratos/r17.jpg" alt="">Duelista</label>
                  <label class="retrato-opcao"><input type="radio" name="retrato" value="../img/retratos/r18.jpg" onchange="escolherRetratoPronto()"><img class="retrato" src="../img/retratos/r18.jpg" alt="">Caçador</label>
                  <label class="retrato-opcao"><input type="radio" name="retrato" value="../img/retratos/r19.jpg" onchange="escolherRetratoPronto()"><img class="retrato" src="../img/retratos/r19.jpg" alt="">Camponesa</label>
                  <label class="retrato-opcao"><input type="radio" name="retrato" value="../img/retratos/r20.jpg" onchange="escolherRetratoPronto()"><img class="retrato" src="../img/retratos/r20.jpg" alt="">Mercenário</label>
                  <label class="retrato-opcao"><input type="radio" name="retrato" value="../img/retratos/r21.jpg" onchange="escolherRetratoPronto()"><img class="retrato" src="../img/retratos/r21.jpg" alt="">Bandoleiro</label>
                  <label class="retrato-opcao"><input type="radio" name="retrato" value="../img/retratos/r22.jpg" onchange="escolherRetratoPronto()"><img class="retrato" src="../img/retratos/r22.jpg" alt="">General</label>
                  <label class="retrato-opcao"><input type="radio" name="retrato" value="../img/retratos/r23.jpg" onchange="escolherRetratoPronto()"><img class="retrato" src="../img/retratos/r23.jpg" alt="">Lanceira</label>
                  <label class="retrato-opcao"><input type="radio" name="retrato" value="../img/retratos/r24.jpg" onchange="escolherRetratoPronto()"><img class="retrato" src="../img/retratos/r24.jpg" alt="">Comandante</label>
                  <label class="retrato-opcao"><input type="radio" name="retrato" value="../img/retratos/r25.jpg" onchange="escolherRetratoPronto()"><img class="retrato" src="../img/retratos/r25.jpg" alt="">Andarilho</label>
                  <label class="retrato-opcao"><input type="radio" name="retrato" value="../img/retratos/r26.jpg" onchange="escolherRetratoPronto()"><img class="retrato" src="../img/retratos/r26.jpg" alt="">Soldado</label>
                  <label class="retrato-opcao"><input type="radio" name="retrato" value="../img/retratos/r27.jpg" onchange="escolherRetratoPronto()"><img class="retrato" src="../img/retratos/r27.jpg" alt="">Guarda</label>
                </div>
              </div>

              <div class="campo">
                <label class="rotulo" for="retratoArquivo">Enviar minha própria imagem (até 2,5 MB)</label>
                <!-- usarRetratoEnviado() lê a imagem e mostra no resumo -->
                <input class="input" type="file" id="retratoArquivo" accept="image/*" onchange="usarRetratoEnviado()">
              </div>
            </div>
          </div>

          <!-- ========== ETAPA 2: Raça ========== -->
          <div class="card oculto" id="etapa2">
            <div class="linha-titulo">
              <h2 class="card-titulo">Escolha a raça</h2>
            </div>

            <!-- as raças oficiais entram aqui: função desenharRacas() -->
            <div class="galeria" id="gradeRacas"></div>

            <!-- o botão abre e fecha a área de baixo (função abrirComunidade) -->
            <button type="button" class="botao-comunidade" onclick="abrirComunidade('racasComunidade')">+ Raças da comunidade</button>
            <div class="oculto" id="racasComunidade">
              <!-- as raças criadas por jogadores entram aqui: função desenharRacas() -->
              <div class="galeria" id="gradeRacasComunidade"></div>
            </div>
          </div>

          <!-- ========== ETAPA 3: Classe ========== -->
          <div class="card oculto" id="etapa3">
            <div class="linha-titulo">
              <h2 class="card-titulo">Escolha a classe</h2>
            </div>

            <!-- as classes oficiais entram aqui: função desenharClasses() -->
            <div class="galeria" id="gradeClasses"></div>

            <button type="button" class="botao-comunidade" onclick="abrirComunidade('classesComunidade')">+ Classes da comunidade</button>
            <div class="oculto" id="classesComunidade">
              <div class="galeria" id="gradeClassesComunidade"></div>
            </div>
          </div>

          <!-- ========== ETAPA 4: Combate e itens ========== -->
          <div class="card oculto" id="etapa4">
            <h2 class="card-titulo">Combate</h2>

            <div class="linha-campos">
              <div class="campo">
                <label class="rotulo" for="vidaMaxima">Vida máxima (1 a 1000)</label>
                <input class="input" type="number" id="vidaMaxima" value="10" min="1" oninput="desenharResumo()" max="1000">
              </div>
              <div class="campo">
                <label class="rotulo" for="vidaAtual">Vida atual (até a vida máxima)</label>
                <input class="input" type="number" id="vidaAtual" value="10" min="0" max="1000">
              </div>
            </div>

            <div class="junto">
              <div class="linha-titulo">
                <h2 class="card-titulo">Itens</h2>
                <!-- "1 de 3": escrito pela função desenharItens() -->
                <span class="selo" id="contadorItens">0 de 3</span>
              </div>

              <!-- os itens entram aqui: função desenharItens() -->
              <div class="itens-grade" id="gradeItens"></div>
            </div>
          </div>

          <!-- ========== ETAPA 5: Atributos e detalhes ========== -->
          <div class="card oculto" id="etapa5">
            <h2 class="card-titulo">Atributos</h2>

            <div class="formulario">
              <div class="opcoes">
                <label><input type="radio" name="geracao" value="equilibrado" checked onchange="gerarAtributos('equilibrado')"> Equilibrado</label>
                <label><input type="radio" name="geracao" value="aleatorio" onclick="gerarAtributos('aleatorio')"> Aleatório</label>
                <label><input type="radio" name="geracao" value="personalizado" onchange="gerarAtributos('personalizado')"> Personalizado</label>
              </div>

              <div class="linha-campos">
                <div class="campo"><label class="rotulo" for="forca">Força</label><input class="input" type="number" id="forca" value="12" readonly></div>
                <div class="campo"><label class="rotulo" for="destreza">Destreza</label><input class="input" type="number" id="destreza" value="12" readonly></div>
                <div class="campo"><label class="rotulo" for="constituicao">Constituição</label><input class="input" type="number" id="constituicao" value="12" readonly></div>
                <div class="campo"><label class="rotulo" for="inteligencia">Inteligência</label><input class="input" type="number" id="inteligencia" value="12" readonly></div>
                <div class="campo"><label class="rotulo" for="sabedoria">Sabedoria</label><input class="input" type="number" id="sabedoria" value="12" readonly></div>
                <div class="campo"><label class="rotulo" for="carisma">Carisma</label><input class="input" type="number" id="carisma" value="12" readonly></div>
              </div>
            </div>

            <div class="junto">
              <h2 class="card-titulo">Detalhes</h2>

              <div class="formulario">
                <div class="linha-campos">
                  <div class="campo">
                    <label class="rotulo" for="nivel">Nível (1 a 100)</label>
                    <input class="input" type="number" id="nivel" value="1" min="1" max="100">
                  </div>
                  <div class="campo">
                    <label class="rotulo" for="alinhamento">Alinhamento</label>
                    <select class="input" id="alinhamento">
                      <option>Ordeiro</option>
                      <option selected>Neutro</option>
                      <option>Caótico</option>
                    </select>
                  </div>
                </div>

                <div class="campo">
                  <label class="rotulo" for="personalidade">Personalidade</label>
                  <textarea class="input" id="personalidade" placeholder="Ex.: Curioso, teimoso e desconfiado."></textarea>
                </div>

                <div class="campo">
                  <label class="rotulo" for="historia">História</label>
                  <textarea class="input" id="historia" placeholder="Conte de onde seu personagem veio e por que ele aventura."></textarea>
                </div>
              </div>
            </div>
          </div>

          <!-- BOTÕES: mostrarEtapa() esconde o Voltar na 1ª etapa e troca o Próximo pelo Salvar na última -->
          <div class="botoes">
            <button type="button" class="botao oculto" id="botaoVoltar" onclick="voltar()">Voltar</button>
            <button type="button" class="botao botao-principal" id="botaoProximo" onclick="proximo()">Próximo</button>
            <button type="button" class="botao botao-principal oculto" id="botaoSalvarFicha" onclick="salvarFicha()">Salvar ficha</button>
            <a class="botao" href="fichas.html">Cancelar</a>
          </div>
        </div>

        <!-- RESUMO do personagem (coluna da direita): a função desenharResumo() escreve em cada id -->
        <aside class="resumo">
          <div class="resumo-arte"><img id="resumoRetrato" src="../img/retratos/r01.jpg" alt=""></div>
          <div class="resumo-texto">
            <h3 id="resumoNome">Seu personagem</h3>
            <p id="resumoLinha"></p>
            <p id="resumoItens"></p>
          </div>
        </aside>
      </div>

    </div>
  </main>

  <!-- DADO: o botão do cantinho. As funções abrirDado() e rolarDado() estão no script.js -->
  <button type="button" class="dado-botao" onclick="abrirDado()" title="Rolar dado"><img src="../img/icones/dado.svg" alt="Rolar dado"></button>
  <div class="dado-menu oculto" id="dadoMenu">
    <p>Escolha o dado</p>
    <div class="dado-faces">
      <button type="button" onclick="rolarDado(4)">d4</button>
      <button type="button" onclick="rolarDado(6)">d6</button>
      <button type="button" onclick="rolarDado(8)">d8</button>
      <button type="button" onclick="rolarDado(10)">d10</button>
      <button type="button" onclick="rolarDado(12)">d12</button>
      <button type="button" onclick="rolarDado(20)">d20</button>
    </div>
    <!-- o número sorteado aparece aqui (rolarDado) -->
    <div class="dado-resultado oculto" id="dadoResultado"></div>
  </div>
  <!-- script.js primeiro (funções usadas em todas as páginas), depois o desta página -->
  <script src="../js/script.js"></script>
  <script src="../js/visual.js"></script>     <!-- só a aparência (modo escuro, abertura, Natal) -->
  <script src="../js/criar-ficha.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fichas | Peak</title>

  <!-- fontes do site (Poppins nos textos, Playfair Display nos títulos da oficina) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700&display=swap">

  <!-- VISUAL: ANTES DE DESENHAR. Este script roda antes da página aparecer:
       - modo escuro: o <html> já ganha a classe "escuro" e a página não pisca branca;
       - abertura: na primeira página da visita (logado), o <html> ganha a classe "abrindo"
         e a página fica escondida até a abertura aparecer (assim o Início não pisca antes).
       (O resto do tema e da abertura está no script.js.) -->
  <script>
    if(localStorage.getItem('tema') == 'escuro'){
      document.documentElement.classList.add('escuro')
    }

    if(localStorage.getItem('token') && !sessionStorage.getItem('abriu')){
      document.documentElement.classList.add('abrindo')
    }
  </script>

  <!-- style.css = o que é igual em todas as páginas | os outros = só desta página -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/fichas.css">
</head>
<body>

  <!-- MENU LATERAL: igual em todas as páginas de dentro. A classe "ativo" marca a página atual. -->
  <aside class="lateral">
    <!-- a conta fica em cima (no lugar da logo). A letra e o nome são preenchidos pelo verificarLogin() do script.js -->
    <a class="lateral-conta" href="perfil.html">
      <div class="avatar" id="menuLetra"></div>
      <span><strong id="menuNome"></strong><small>Ver perfil</small></span>
    </a>

    <nav class="lateral-grupo">
      <a class="lateral-link" href="inicio.html"><img src="../img/icones/inicio.svg" alt=""><span>Início</span></a>
      <a class="lateral-link ativo" href="fichas.html"><img src="../img/icones/fichas.svg" alt=""><span>Fichas</span></a>
      <a class="lateral-link" href="campanhas.html"><img src="../img/icones/campanhas.svg" alt=""><span>Campanhas</span></a>
     <a class="lateral-link" href="monstros.html"><img src="../img/icones/bestiario.svg" alt=""><span>Bestiário</span></a>
       <a class="lateral-link" href="comunidade.html"><img src="../img/icones/comunidade.svg" alt=""><span>Comunidade</span></a>
    
     <a class="lateral-link" href="historia.html"><img src="../img/icones/historia.svg" alt=""><span>História</span></a>
      <!-- só aparece para administradores: quem tira a classe "oculto" é o verificarLogin() do script.js -->
      <a class="lateral-link oculto" id="linkAdmin" href="admin.html"><img src="../img/icones/admin.svg" alt=""><span>Administração</span></a>
      <!-- VISUAL: só aparece no celular, abre o menu inteiro (abrirMais do script.js) -->
      <button type="button" class="lateral-link botao-mais" onclick="abrirMais()"><img src="../img/icones/mais.svg" alt=""><span>Mais</span></button>
    </nav>

    <div class="lateral-rodape">
      <a class="lateral-link" href="perfil.html?aba=configuracoes"><img src="../img/icones/configuracoes.svg" alt=""><span>Configurações</span></a>
      <button type="button" class="lateral-link" onclick="sair()"><img src="../img/icones/sair.svg" alt=""><span>Sair</span></button>
    </div>
  </aside>

  <!-- TOPO: "Boa noite, fulano" (preenchido pelo verificarLogin() do script.js) -->
  <header class="topo">
    <div class="topo-oi"><span id="saudacao">Olá</span>, <b id="nomeLogado"></b></div>
  </header>

  <main class="secao">
    <div class="container">

      <div class="cabecalho-pagina">
        <h1 class="titulo">Fichas</h1>
      </div>

      <nav class="abas">
        <a href="fichas.html" class="ativo">Personagens</a>
        <a href="racas.html">Raças</a>
        <a href="classes.html">Classes</a>
      </nav>

      <!-- As cartas das fichas entram aqui: js/fichas.js, função carregarFichas().
           O HTML de cada carta vem da função htmlCarta() do js/script.js. -->
      <div class="grade-cartas" id="listaFichas">
        <!-- VISUAL: o círculo girando aparece até o JS desenhar a lista (o innerHTML apaga ele) -->
        <div class="carregando"><span></span>Carregando…</div>
      </div>

    </div>
  </main>

  <!-- DADO: o botão do cantinho. As funções abrirDado() e rolarDado() estão no script.js -->
  <button type="button" class="dado-botao" onclick="abrirDado()" title="Rolar dado"><img src="../img/icones/dado.svg" alt="Rolar dado"></button>
  <div class="dado-menu oculto" id="dadoMenu">
    <p>Escolha o dado</p>
    <div class="dado-faces">
      <button type="button" onclick="rolarDado(4)">d4</button>
      <button type="button" onclick="rolarDado(6)">d6</button>
      <button type="button" onclick="rolarDado(8)">d8</button>
      <button type="button" onclick="rolarDado(10)">d10</button>
      <button type="button" onclick="rolarDado(12)">d12</button>
      <button type="button" onclick="rolarDado(20)">d20</button>
    </div>
    <!-- o número sorteado aparece aqui (rolarDado) -->
    <div class="dado-resultado oculto" id="dadoResultado"></div>
  </div>
  <!-- script.js primeiro (funções usadas em todas as páginas), depois o desta página -->
  <script src="../js/script.js"></script>
  <script src="../js/fichas.js"></script>
</body>
</html>
